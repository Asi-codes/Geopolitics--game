
<!DOCTYPE html>
<html>
<head>
    <title>Geopolitics Game</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
            padding: 30px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Conquer the World</h1>
    <p>Play a strategy game against other countries.</p>

    <div id="login">
        <h2>Create an account or log in</h2>

        <input type="email" id="email" placeholder="Enter email">
        <br>

        <input type="password" id="password"
               placeholder="Enter password">
        <br>

        <button onclick="signup()">Create Account</button>
        <button onclick="login()">Log In</button>
    </div>

    <div id="game" style="display:none;">
        <h2>Welcome!</h2>
        <p id="user"></p>
    <h3>Choose your country</h3>
<select id="countryPick"></select>
<button onclick="startGame()">Start New Game</button>

<p id="turnInfo"></p>
<table id="board" border="1" style="margin: auto;"></table>


        <button onclick="logout()">Log Out</button>
    </div>

    <p id="message"></p>

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


        // Connect to Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBZKE8iV1oIyPCoLlonCmRjbpQ7A9E9wpg",
            authDomain: "geopolitics--game.firebaseapp.com",
            projectId: "geopolitics--game",
            storageBucket: "geopolitics--game.firebasestorage.app",
            messagingSenderId: "330186691809",
            appId: "1:330186691809:web:4b1772c475f390937353a0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);


        // Create a new account
        window.signup = async function() {
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;

            try {
                let account = await createUserWithEmailAndPassword(
                    auth, email, password
                );

                await setDoc(doc(db, "users", account.user.uid), {
                    email: account.user.email,
                    createdAt: serverTimestamp()
                });

                document.getElementById("message").innerText =
                    "Account created successfully!";

            } catch (error) {
                document.getElementById("message").innerText =
                    error.message;
            }
        };


        // Log into an existing account
        window.login = async function() {
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;

            try {
                await signInWithEmailAndPassword(auth, email, password);

                document.getElementById("message").innerText =
                    "You have logged in!";

            } catch (error) {
                document.getElementById("message").innerText =
                    "Login failed. Check your details.";
            }
        };


        // Log out
        window.logout = async function() {
            try {
                await signOut(auth);
            } catch (error) {
                document.getElementById("message").innerText =
                    "Could not log out.";
            }
        };


        // Check if someone is logged in
        onAuthStateChanged(auth, function(account) {
            if (account) {
                document.getElementById("login").style.display = "none";
                document.getElementById("game").style.display = "block";

                document.getElementById("user").innerText =
                    "Logged in as " + account.email;

            } else {
                document.getElementById("login").style.display = "block";
                document.getElementById("game").style.display = "none";
            }
        });

    </script>

</body>
</html>
