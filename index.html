<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geopolitics Game</title>
<style>
  :root {
    --paper: #f3f6f8;
    --ink: #14202b;
    --sea: #1d4e6b;
    --dice: #c8372d;
    --line: #c4d0d8;
    --field: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10181f;
      --ink: #e8eef2;
      --sea: #7fb4d1;
      --dice: #ef6a5f;
      --line: #2c3b47;
      --field: #17222b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 26rem; margin: 0 auto; padding: 3rem 1.25rem; }

  /* The one memorable element: a die showing six. */
  .die {
    width: 3.5rem; height: 3.5rem; padding: 0.55rem;
    display: grid; grid-template: repeat(3, 1fr) / repeat(2, 1fr);
    place-items: center;
    border: 3px solid var(--ink); border-radius: 0.8rem;
    margin-bottom: 1.25rem;
  }
  .die i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--dice); }

  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 2.4rem; line-height: 1.1; margin: 0 0 0.5rem;
  }
  .lede { margin: 0 0 2rem; color: var(--sea); }

  label { display: block; margin: 1rem 0 0.35rem; font-weight: 600; }
  input {
    width: 100%; padding: 0.7rem; font: inherit; color: inherit;
    background: var(--field); border: 1px solid var(--line); border-radius: 0.4rem;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--sea); outline-offset: 2px; }

  .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
  button {
    padding: 0.75rem 1.1rem; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink); border-radius: 0.4rem;
  }
  button.secondary { background: transparent; color: var(--ink); }

  #msg { min-height: 1.5rem; margin-top: 1.25rem; }
  #msg[data-kind="error"] { color: var(--dice); }
  #msg[data-kind="ok"] { color: var(--sea); }
</style>
</head>
<body>
<main>
  <div class="die" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <h1>Conquer the world.</h1>
  <p class="lede">A single-player strategy game against computer-controlled countries.</p>

  <!-- Shown when nobody is logged in -->
  <section id="signedOut">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="password">Password (at least 6 characters)</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="actions">
      <button id="loginBtn" type="button">Log in</button>
      <button id="signupBtn" type="button" class="secondary">Create account</button>
    </div>
  </section>

  <!-- Shown when someone is logged in -->
  <section id="signedIn" hidden>
    <p>Logged in as <strong id="who"></strong>.</p>
    <button id="logoutBtn" type="button" class="secondary">Log out</button>
  </section>

  <p id="msg" role="status"></p>
</main>

<script type="module">
  // The Firebase tools we use, loaded straight from Google (nothing to install).
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // 1. CONNECT: these details tell the page which Firebase project to talk to.
  const firebaseConfig = {
    apiKey: "AIzaSyBZKE8iV1oIyPCoLlonCmRjbpQ7A9E9wpg",
    authDomain: "geopolitics--game.firebaseapp.com",
    projectId: "geopolitics--game",
    storageBucket: "geopolitics--game.firebasestorage.app",
    messagingSenderId: "330186691809",
    appId: "1:330186691809:web:4b1772c475f390937353a0"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);     // handles accounts and logging in
  const db = getFirestore(app);  // the NoSQL database

  const $ = (id) => document.getElementById(id);

  // Shows a short message under the form (kind is "ok" or "error").
  function say(text, kind) {
    $("msg").textContent = text;
    $("msg").dataset.kind = kind || "ok";
  }

  // 2. VALIDATE: check the form before anything is sent to Firebase.
  function readForm() {
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email.includes("@")) { say("Enter a valid email address.", "error"); return null; }
    if (password.length < 6) { say("Use a password with at least 6 characters.", "error"); return null; }
    return { email, password };
  }

  // 3. CREATE ACCOUNT: make the login, then save a matching record in the "users" collection.
  $("signupBtn").addEventListener("click", async () => {
    const form = readForm();
    if (!form) return;
    try {
      const cred = await createUserWithEmailAndPassword(auth, form.email, form.password);
      await setDoc(doc(db, "users", cred.user.uid), {
        email: cred.user.email,
        createdAt: serverTimestamp()
      });
      say("Account created. You are logged in.");
    } catch (error) {
      say(explain(error), "error");
    }
  });

  // 4. LOG IN: Firebase checks the email and password for us.
  $("loginBtn").addEventListener("click", async () => {
    const form = readForm();
    if (!form) return;
    try {
      await signInWithEmailAndPassword(auth, form.email, form.password);
      say("Logged in.");
    } catch (error) {
      say(explain(error), "error");
    }
  });

  // 5. LOG OUT
  $("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    say("Logged out.");
  });

  // 6. WATCH LOGIN STATE: show the right section whenever someone logs in or out.
  onAuthStateChanged(auth, (user) => {
    $("signedOut").hidden = Boolean(user);
    $("signedIn").hidden = !user;
    if (user) $("who").textContent = user.email;
  });

  // Turns Firebase error codes into plain instructions.
  function explain(error) {
    const messages = {
      "auth/email-already-in-use": "That email already has an account. Choose Log in instead.",
      "auth/invalid-credential": "Email or password is wrong. Check both and try again.",
      "auth/user-not-found": "Email or password is wrong. Check both and try again.",
      "auth/wrong-password": "Email or password is wrong. Check both and try again.",
      "auth/invalid-email": "Enter a valid email address.",
      "auth/network-request-failed": "No connection. Check your internet and try again."
    };
    return messages[error.code] || "Something went wrong (" + error.code + "). Try again.";
  }
</script>
</body>
</html>
